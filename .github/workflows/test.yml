name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Быстрый сигнал: синтаксис и тесты на моках. Держим отдельно от браузерных,
  # чтобы поломку было видно за полминуты, а не после установки Chromium.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

  # Браузерные проверки: вёрстка, жесты, Shorts, перенос громкости. Ловят то,
  # чего не видят моки, — за это они и стоят установки Chromium.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:browser
