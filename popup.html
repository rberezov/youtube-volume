<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="appShortName">Точная громкость</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <img class="app-icon" src="icons/icon-48.png" alt="">
    <div class="header-copy">
      <h1 data-i18n="appShortName">Точная громкость</h1>
      <p data-i18n="appName">YouTube Exponential Volume</p>
    </div>
  </header>

  <main>
    <section class="card master-card" aria-labelledby="enabledTitle">
      <label class="switch-row switch-row--master" for="enabled">
        <span class="switch-copy">
          <span class="switch-title" id="enabledTitle" data-i18n="enabledTitle">Экспоненциальная громкость</span>
          <span class="switch-description" data-i18n="enabledDescription">Точная регулировка на низкой громкости</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="enabled">
          <span class="switch-track" aria-hidden="true"></span>
        </span>
      </label>
    </section>

    <section class="card" aria-labelledby="curveTitle">
      <div class="section-heading">
        <div>
          <h2 id="curveTitle" data-i18n="curveTitle">Точность тихого звука</h2>
        </div>
        <output class="value-badge" id="gammaValue" for="gamma"></output>
      </div>
      <label class="sr-only" for="gamma" data-i18n="curveLabel">Точность регулировки тихого звука</label>
      <input class="range" type="range" id="gamma" min="1" max="6" step="0.1">
      <div class="range-labels" aria-hidden="true">
        <span data-i18n="curveRangeLow">Как в YouTube</span>
        <span data-i18n="curveRangeMid">Оптимально: 3</span>
        <span data-i18n="curveRangeHigh">Больше точности</span>
      </div>
      <p class="curve-example" id="curveExample"></p>
    </section>

    <section class="card own-only" aria-labelledby="sizeTitle">
      <div class="section-heading section-heading--compact">
        <div>
          <h2 id="sizeTitle" data-i18n="sizeTitle">Размер ползунка</h2>
        </div>
      </div>

      <div class="range-grid">
        <div class="range-setting">
          <div class="range-setting__heading">
            <label for="sliderScale" data-i18n="sizeVideo">Обычное видео</label>
            <output class="value-badge value-badge--small" id="scaleValue" for="sliderScale"></output>
          </div>
          <input class="range" type="range" id="sliderScale" min="2" max="70" step="1">
        </div>

        <div class="range-setting">
          <div class="range-setting__heading">
            <label for="shortsScale" data-i18n="sizeShorts">Shorts</label>
            <output class="value-badge value-badge--small" id="shortsValue" for="shortsScale"></output>
          </div>
          <input class="range" type="range" id="shortsScale" min="2" max="70" step="1">
        </div>
      </div>
    </section>

    <section class="card" aria-labelledby="behaviorTitle">
      <h2 id="behaviorTitle" data-i18n="behaviorTitle">Поведение</h2>

      <label class="switch-row own-only" for="showPercent">
        <span class="switch-copy">
          <span class="switch-title" data-i18n="showPercentTitle">Показывать проценты</span>
          <span class="switch-description" data-i18n="showPercentDescription">Точное значение рядом со шкалой</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="showPercent">
          <span class="switch-track" aria-hidden="true"></span>
        </span>
      </label>

      <label class="switch-row own-only" for="autoCollapse">
        <span class="switch-copy">
          <span class="switch-title" data-i18n="autoCollapseTitle">Сворачивать автоматически</span>
          <span class="switch-description" data-i18n="autoCollapseDescription">Компактный вид без курсора</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="autoCollapse">
          <span class="switch-track" aria-hidden="true"></span>
        </span>
      </label>

      <label class="switch-row switch-row--sub own-only" id="collapseDelayRow" for="collapseDelay">
        <span class="switch-copy">
          <span class="switch-title" data-i18n="collapseDelayTitle">Задержка перед сворачиванием</span>
          <span class="switch-description" data-i18n="collapseDelayDescription">Удобно с длинной шкалой</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="collapseDelay">
          <span class="switch-track" aria-hidden="true"></span>
        </span>
      </label>

      <label class="switch-row" for="normalizeLoudness">
        <span class="switch-copy">
          <span class="switch-title" data-i18n="normalizeTitle">Выравнивать громкость роликов</span>
          <span class="switch-description" data-i18n="normalizeDescription">Заменить Stable Volume YouTube своим выравниванием</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="normalizeLoudness">
          <span class="switch-track" aria-hidden="true"></span>
        </span>
      </label>

      <div class="range-row range-row--sub" id="maxBoostRow">
        <label for="maxBoostDb" data-i18n="maxBoostTitle">Предел подъёма</label>
        <input class="range" type="range" id="maxBoostDb" min="1" max="15" step="1">
        <output class="value-badge value-badge--small" id="maxBoostValue" for="maxBoostDb"></output>
      </div>

      <label class="switch-row" for="useNativeSlider">
        <span class="switch-copy">
          <span class="switch-title" data-i18n="useNativeTitle">Использовать шкалу YouTube</span>
          <span class="switch-description" data-i18n="useNativeDescription">Скрыть ползунок расширения</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="useNativeSlider">
          <span class="switch-track" aria-hidden="true"></span>
        </span>
      </label>
    </section>
  </main>

  <footer class="footer">
    <span class="save-status" id="saveStatus" role="status" aria-live="polite">
      <span class="save-dot" aria-hidden="true"></span>
      <span id="saveStatusText" data-i18n="saveSaved">Сохранено</span>
    </span>
    <button class="reset-button" id="resetSettings" type="button" data-i18n="resetButton">Сбросить</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
